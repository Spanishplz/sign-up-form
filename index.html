<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up-form</title>
        <link rel="stylesheet" href="styles.css" type="text/css">
        <script src="script.js"></script>
    </head>
    <body>
        <div class="image-div">
            <h1 class="title">ODIN PROJECT</h1>
        </div>
        <main class="content-div">
            <div class="content-wrapper">
                <header>
                    <p>This is not a real online service! You know you need something like this in your life to realize your deepest dreams. Sign up <em>now</em> to get startet</p>
                    <p>You <em>know</em> you want to</p>
                </header>
                    <form>
                        <div class="form-body">
                            <h2>Let's do this</h2>
                            <div>
                                <p>
                                    <label for="first-name">FIRST NAME</label>
                                    <input id="first-name" type="text" for="first-name">
                                    </p>
                                    <p>
                                        <label for="last-name">LAST NAME</label>
                                        <input id="last-name" type="text" for="last-name">
                                    </p>
                            </div>
                            <div>
                            <p>
                                <label for="email">EMAIL</label>
                                <input id="email" type="email" for="email">
                                </p>
                                <p>
                                    <label for="phone">PHONE NUMBER</label>
                                    <input id="phone" type="number" for="phone">
                                </p>
                            </div>
                            <div>
                                <p>
                                    <label for="password">PASSWORD</label>
                                    <input id="password" type="password" for="password">
                                    </p>
                                    <p>
                                        <label for="c-password">CONFIRM PASSWORD</label>
                                        <input id="c-password" type="password" for="c-password">
                                    </p>
                            </div>
                        </div>
                        <div class="form-footer">
                            <button>Create account</button>
                            <p>Already have an account? <a href="">Log in</a></p>
                        </div>
                    </form>
            </div>
        </main>
    </body>
</html>
